server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # el backend genera el PDF con Chromium -- puede tardar, no cortar la respuesta pronto.
  client_max_body_size 20m;

  # cabeceras de seguridad, en todas las respuestas (estáticas y /api/, que también pasa
  # por este bloque server) -- "always" para que también vayan en respuestas de error.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # connect-src: 'self' (API propia) + el Frontend API de Clerk (login) -- el dominio
  # depende de la instancia de Clerk (VITE_CLERK_PUBLISHABLE_KEY), hoy
  # busy-wolf-6455.clerk.accounts.dev; si cambian de instancia de Clerk hay que actualizar
  # esto también. script-src/frame-src incluyen Cloudflare Turnstile porque Clerk lo usa
  # como verificación anti-bot (captcha_provider:"turnstile" en su config pública) y puede
  # activarse en el login. style-src permite inline porque el SVG del hero usa
  # style="--r:...s" en vez de clases -- si eso se limpia, se puede quitar 'unsafe-inline'.
  # worker-src/img-src con blob: -- sin HTTPS (secure context), Clerk no puede usar cookies
  # normales y cae a un mecanismo de respaldo (__clerk_db_jwt en la URL) que abre un worker
  # y una imagen desde blob:, siempre del mismo origen (nunca una URL remota, así que no
  # afloja la protección real de la CSP). Una vez haya dominio+HTTPS, Clerk no debería
  # necesitar este respaldo, pero se deja permitido por si igual lo usa.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://busy-wolf-6455.clerk.accounts.dev; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.wompi.co" always;

  location /api/ {
    proxy_pass http://backend:8787/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
  }

  # la herramienta (login + análisis + pago) -- página aparte de la landing
  location = /app {
    try_files /app.html =404;
  }

  # panel de métricas -- página aparte, no la SPA principal
  location = /admin {
    try_files /admin.html =404;
  }

  # todo lo demás cae a la landing (index.html)
  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # el backend genera el PDF con Chromium -- puede tardar, no cortar la respuesta pronto.
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://backend:8787/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
  }

  # la herramienta (login + análisis + pago) -- página aparte de la landing
  location = /app {
    try_files /app.html =404;
  }

  # panel de métricas -- página aparte, no la SPA principal
  location = /admin {
    try_files /admin.html =404;
  }

  # todo lo demás cae a la landing (index.html)
  location / {
    try_files $uri $uri/ /index.html;
  }
}

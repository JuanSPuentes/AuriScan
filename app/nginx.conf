server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # el backend genera el PDF con Chromium -- puede tardar, no cortar la respuesta pronto.
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://backend:8787/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
  }

  # SPA -- todo lo demás cae a index.html (el manejo de rutas es del lado del cliente)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
